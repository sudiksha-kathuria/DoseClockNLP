<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>DoseClock - Add Medicine</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="page-form">
    <section class="card form-card">
      <div class="form-header">
        <div class="brand">DoseClock</div>
        <h1>Add a medicine reminder</h1>
        <p>We'll call it out loud, right on time.</p>
      </div>

      <form id="medicine-form">
        <div class="field-group">
          <label for="medicine_name">Medicine name</label>
          <input
            type="text"
            id="medicine_name"
            name="medicine_name"
            placeholder="e.g. Vitamin D"
            autocomplete="off"
            required
          />
        </div>

        <div class="field-group">
          <label>Time(s) of day</label>
          <div class="times-list" id="times-list">
            <div class="time-row">
              <input type="time" name="times" value="08:00" required />
              <button type="button" class="remove-time" aria-label="Remove time" title="Remove">&times;</button>
            </div>
          </div>
          <button type="button" class="add-time" id="add-time-btn">+ Add another time</button>
        </div>

        <div class="field-group">
          <label for="days">Course length (days)</label>
          <input type="number" id="days" name="days" min="1" value="7" required />
        </div>

        <div class="field-group">
          <label for="language">Voice reminder language</label>
          <select id="language" name="language" required>
            {% for code, label in languages %}
              <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="submit-btn">Save reminder</button>
        <p class="form-error" id="form-error"></p>
      </form>

      <div class="form-footer">
        <a href="{{ url_for('clock') }}">Skip to clock &rarr;</a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
